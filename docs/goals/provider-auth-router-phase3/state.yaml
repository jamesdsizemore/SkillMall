        configure_contract: "Configure accepts env_key, gateway_virtual_key_ref, local_cli_session, none_local, cloud/project fields, local endpoint/baseUrl, and custom OpenAI-compatible baseUrl; rejects apiKey/rawKey/token/sessionToken/credentialPath-style fields."
