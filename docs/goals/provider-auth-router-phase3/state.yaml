        model_refresh: "Every row declares discoveryStrategy: openai_compatible_models, official_provider_models, account_scoped_models, cloud_project_scoped_models, local_runtime_models, manual_custom_models, static_fallback_only, or planned_provider_source_review. Refresh only calls supported/configured strategies."
