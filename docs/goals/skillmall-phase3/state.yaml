      - app/api/marketplace/checkout/route.ts
      - app/api/webhooks/stripe/route.ts
      - app/api/marketplace/entitlement/route.ts
    verify:
      - "npx tsc --noEmit exits 0"
      - "npm run build exits 0"
      - "POST /api/webhooks/stripe with invalid Stripe-Signature -> 400 (never processes payload)"
      - "POST /api/marketplace/checkout returns checkoutUrl string (smoke test with Stripe test key)"
      - "Webhook with valid signature stores purchase in SQLite (test with Stripe CLI stripe listen)"
    stop_if:
      - "STRIPE_SECRET_KEY not in .env.local — add it before continuing"
      - "export const config = {api: {bodyParser: false}} missing from webhook route — add it before any other code"
      - "Need files outside allowed_files"
    receipt: null

  # ─── DOCUMENTATION ────────────────────────────────────────────────────────

  - id: T208
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: default
    objective: "Write all 5 Phase 3 documentation files, each >= 500 words: docs/user/skill-chains.md (canvas walkthrough, chain.json format, chain SKILL.md spec), docs/user/rag-enhanced-skills.md (provider embedding support matrix, attach-knowledge CLI, /api/retrieve usage), docs/user/self-improvement-loop.md (feedback submission, suggestion generation, approval workflow), docs/user/marketplace.md (3 tiers, revenue split, launch conditions, Stripe test mode), docs/reference/chain-format.md (chain SKILL.md frontmatter + chain.json spec)."
