      - "A starter SKILL.md description is a placeholder or generic — every starter must have real, domain-specific content with only the user-specific fields marked [fill-in]"
      - "Content cannot be verified against a source — each starter README.md must cite the authoritative reference (e.g., 'Based on the Conventional Commits specification at conventionalcommits.org'). No citations = stop."
