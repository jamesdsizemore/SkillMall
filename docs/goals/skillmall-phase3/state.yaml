# GoalBuddy v2 state.yaml — SkillMall Phase 3

version: 2

goal:
  title: "SkillMall Phase 3 — Advanced Capabilities"
  slug: skillmall-phase3
  kind: existing_plan
  tranche: "Build all missed Phase 1/2 features (T251-T256, T261-T268, T271-T275) then Phase 3 features (T201-T209: chains, RAG, self-improvement, marketplace). 28 total tasks."
  status: active
  intake:
    original_request: "Build SkillMall Phase 3 from docs/superpowers/plans/PHASE-3-PLAN.md"
    interpreted_outcome: "Chains, RAG, self-improvement loop, and marketplace (code-gated) all built and working. Marketplace hidden behind runtime gate until launch conditions met — gate enforces itself, not us."
    input_shape: existing_plan
    audience: "James Sizemore — project owner"
    authority: approved
    proof_type: demo
    completion_proof: "Chain created via canvas, RAG embeds and retrieves, feedback triggers suggestions, approval gate prevents auto-writes, marketplace gate returns correct ready:false, all Phase 3 docs >= 500 words"
    likely_misfire: "Blocking T201-T205 on marketplace launch conditions. Building marketplace without the code gate. Implementing Stripe before checkMarketplaceReady() is wired up."
    blind_spots_considered:
      - "sqlite-vss is a native extension — may require node-gyp, same as better-sqlite3; test loadExtension() before writing any RAG code"
      - "React Flow requires client-side only — ChainCanvas must be 'use client' and dynamically imported to avoid SSR issues"
      - "Stripe webhook requires raw body (bodyParser: false) — this is easy to get wrong and breaks signature verification silently"
      - "Claude Code CLI does not support embeddings — users need SKILL_MALL_EMBEDDING_PROVIDER separate from main provider for RAG"
      - "Self-improvement applier writes to disk — must verify author identity before applying any suggestion (session.github_login === skill.author)"
      - "Marketplace launch conditions are code-enforced, not honor-system — checkMarketplaceReady() gates the entire marketplace UI and API"
    existing_plan_facts:
      - "Full plan: docs/superpowers/plans/PHASE-3-PLAN.md — 58KB, all implementation embedded"
      - "React Flow canvas: ChainCanvas.tsx + ChainEdgeConfig.tsx — full component code in plan"
      - "chain.json format: name, slug, steps[{order, skillSlug, usesOutput, passesAs, namedVariable, instructions}]"
      - "RAG: better-sqlite3 + sqlite-vss extension loaded via db.loadExtension(). Per-provider embedding: openai uses text-embedding-3-small, ollama uses nomic-embed-text, claude-code not supported"
      - "Self-improvement: skill_feedback table (satisfaction 1-5, body 200 chars), improvement_suggestions table (status: pending/approved/rejected), applier uses LLM to generate edit + bumps version"
      - "Author verification: ALWAYS check session.github_login === skill.author before applying any suggestion"
      - "Marketplace gate: checkMarketplaceReady() checks 4 conditions: catalog>=200, community>=500, ratings>=3months, skillsWithTests>=50"
      - "Stripe: STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET in .env.local. Webhook MUST use arrayBuffer + Buffer.from for raw body. MUST add export const config = {api: {bodyParser: false}}"
      - "Phase 3 SQLite migration: db/migrations/002_phase3.sql — skill_feedback, improvement_suggestions, knowledge_bases, knowledge_chunks, purchases, skill_tiers tables"
      - "Development workflow: 16 steps per task. Security check mandatory for every Phase 3 task."
      - "MISSED FROM PHASE 1 spec: Agent Budget Analyzer, Domain Starter Templates"
      - "MISSED FROM PHASE 2 spec: Codebase-to-Skill Extractor, Skill Dependency Graph, Skill Testing Framework, Multilingual Support"
      - "T251-T256 are these missed features — they run before Phase 3 chains/RAG/marketplace"
      - "FILE CONFLICT ORDERING: cli/src/index.ts is modified by 8 tasks — always in this order: T262, T261, T264, T273, T267, T265, T268. Never in parallel."
      - "FILE CONFLICT ORDERING: SkillTabs.tsx is modified by 5 tasks — T263 and T261 both add a PROMPTS tab and MUST be merged into a single task before execution"
      - "FILE CONFLICT ORDERING: app/skills/[category]/[slug]/page.tsx is modified by 8 tasks — sequential only"
      - "FILE CONFLICT ORDERING: lib/analytics.ts is modified by T265, T266, T274 — sequential only"
      - "BUDGET ANALYZER: implement as user-configurable --chars-available N, not agent-specific hardcoded values. Agent-specific values are undocumented and will be hallucinated."
      - "REGEN-PROMPT: requires ResearchTool data stored in resources/build-metadata.json — add that storage to the pipeline (lib/pipeline.ts) and add build-metadata to T261 allowed_files"
      - "T257 is MISSING from board: write test suites for all 20 domain starters (tests/<slug>/*.json). Without this task, Phase 3 marketplace gate (skillsWithTests >= 50) can never be met."
      - "Skill Testing Framework (T255) is required for Phase 3 marketplace gate (>=50 skills with test coverage)"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: starting
    url: null
    command: "npx goalbuddy board /Users/jamesdsizemore/Developer/skill-mall/docs/goals/skillmall-phase3"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

