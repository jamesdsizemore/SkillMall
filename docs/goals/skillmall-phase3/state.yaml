      - "npm run build exits 0"
      - "npm test lib/__tests__/self-improvement all pass"
      - "Approving suggestion as non-author returns 403 (test)"
      - "bumpVersion('1.2.3', 'patch') returns '1.2.4' (test)"
      - "applySuggestion writes file and bumps version (mocked LLM test)"
      - "No automatic writes ever happen without author approval (test)"
    stop_if:
      - "applySuggestion does not verify author identity — fix before continuing"
      - "Need files outside allowed_files"
    receipt: null

  # ─── MARKETPLACE ─────────────────────────────────────────────────────────

  - id: T206
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: default
    objective: "Implement marketplace gate and tier system: lib/marketplace/gate.ts (checkMarketplaceReady — 4 conditions, returns ready:false with current counts until all met), skill_tiers table queries, GET /api/marketplace/status route, marketplace UI visible ONLY when checkMarketplaceReady() returns ready:true, TierBadge component, PremiumTeaser page for locked premium skills."
    allowed_files:
      - lib/marketplace/gate.ts
      - lib/marketplace/entitlement.ts
      - lib/__tests__/marketplace.test.ts
      - app/api/marketplace/status/route.ts
      - app/api/marketplace/entitlement/route.ts
      - components/skill-mall/marketplace/TierBadge.tsx
      - components/skill-mall/marketplace/PremiumTeaser.tsx
      - app/skills/[category]/[slug]/page.tsx
    verify:
      - "npx tsc --noEmit exits 0"
      - "npm run build exits 0"
      - "npm test lib/__tests__/marketplace all pass"
      - "checkMarketplaceReady() returns ready: false with current counts when conditions not met (test)"
      - "checkMarketplaceReady() returns ready: true only when ALL 4 conditions pass (test)"
      - "GET /api/marketplace/status returns correct ready: false with condition breakdown (smoke test)"
      - "Marketplace UI does not render when ready: false (smoke test)"
    stop_if:
      - "Need files outside allowed_files"
    receipt: null

  - id: T207
