      - skills/_starters/
      - cli/src/commands/new.ts
      - cli/src/index.ts
    verify:
      - "npx tsc --noEmit exits 0"
      - "cd cli && npm run build exits 0"
      - "All 20 starter directories exist under skills/_starters/"
      - "Each starter has SKILL.md, README.md, resources/templates/, starter-config.json"
      - "npx skill-mall new --from-template code-review my-code-review creates skills/<category>/my-code-review/ with SKILL.md pre-populated"
      - "bash scripts/validate-skill.sh skills/_starters/code-review exits 0 (starters must be valid)"
