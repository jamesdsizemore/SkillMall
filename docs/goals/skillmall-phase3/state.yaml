    assignee: Worker
    status: queued
    reasoning_hint: default
    objective: "Implement Stripe payment integration: lib/marketplace/payments.ts (createCheckoutSession, handleWebhook with signature verification), POST /api/marketplace/checkout, POST /api/webhooks/stripe (bodyParser: false, MUST verify Stripe-Signature header), GET /api/marketplace/entitlement. Stripe test mode only — live mode gated on marketplace launch conditions."
    allowed_files:
