# GoalBuddy v2 state.yaml — SkillMall Phase 4

version: 2

goal:
  title: "SkillMall Phase 4 — Comprehensive Documentation"
  slug: skillmall-phase4
  kind: existing_plan
  tranche: "Write 20 new documentation files totaling 67,000+ words: 9 developer docs, 8 end-user guide docs, 5 marketing docs. Replace existing stub docs. Build /docs site infrastructure. All commands verified against running app before publishing."
  status: active
  intake:
    original_request: "Create full developer docs, full end-user tutorial docs, full marketing docs"
    interpreted_outcome: "Three complete documentation suites that a developer can onboard from, a beginner can learn from, and a journalist can quote from — not 500-word stubs"
    input_shape: existing_plan
    audience: "James Sizemore — project owner"
    authority: approved
    proof_type: artifact
    completion_proof: "20 new docs above word count minimums, /docs site renders, T427 audit passes, every command verified, total >= 67,000 words, npm run build succeeds"
    likely_misfire: "Writing thin docs that hit the word count minimum without actually being comprehensive. Documenting features that don't work. Starting end-user docs for Phase 3 features before Phase 3 is built."
    blind_spots_considered:
      - "Every CLI command must be tested against the ACTUAL running CLI — not documentation from memory"
      - "Every API curl example must return the documented response — run it first"
      - "End-user docs assume NOTHING — if you need to explain what a terminal is, do it"
      - "Marketing docs must be honest — never promise features that are Phase 3 or later"
      - "T428 (stub replacement) must happen LAST — after all new docs exist to link to"
      - "T426 (docs infrastructure) can happen any time — independent of content tasks"
    existing_plan_facts:
      - "Full plan: docs/superpowers/plans/PHASE-4-PLAN.md — 84KB, all content specs embedded"
      - "Developer docs target: TypeScript developer, never seen this codebase, can onboard without asking anyone"
      - "End-user docs target: non-technical user, tutorial format, step-by-step, celebrate every milestone"
      - "Marketing docs target: decision-maker/journalist, benefit-first, specific not vague, honest"
      - "Every doc has: one-sentence summary, TOC (if >1000 words), what-you-will-learn statement, cross-links, next-steps section"
      - "Code examples are REAL — run every command, compile every snippet, verify every curl"
      - "Word count minimums in plan are FLOORS not targets — write more if the topic needs it"
      - "Total docs infrastructure target: /docs section in Next.js using next-mdx-remote or contentlayer"
      - "67,000+ words total across all 20 new documents"
      - "FILE CONFLICT: README.md — T401 first (developer section), T421 second (marketing section)"
      - "FILE CONFLICT: docs/guide/index.md — T411 first, T412 second"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: starting
    url: null
    command: "npx goalbuddy board /Users/jamesdsizemore/Developer/skill-mall/docs/goals/skillmall-phase4"
  github_projects:
