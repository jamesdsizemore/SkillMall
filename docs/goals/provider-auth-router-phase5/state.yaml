  intake:
    completion_proof: Focused tests, full tests or documented blocker, TypeScript, lint classification, secret scan, code review/fixes, docs parity, diff containment, and GoalBuddy receipts prove policy/budget controls work across Provider Center, API, CLI, and router without auth or simulation drift.
  oracle:
