    final_proof: Final receipt reports verification results, complete work, incomplete work, blockers, lint classification, secret scan, diff containment, and next safe action.
  hard_constraints:
    - Phase 5 implementation must start from updated main containing Phase 4 merge commit 8ad876a.
    - No hosted gateway/router/proxy/observability product may be required.
    - SkillMall remains the provider/settings/model/pricing/policy/budget/cost source of truth.
    - No raw API keys, ChatGPT browser/session tokens, Claude.ai OAuth tokens, Codex credential files, Claude Code credential files, copied credential-file contents, browser session cookies, or credential-file paths may be accepted.
    - Do not add one ProviderID per broad ProviderRegistryID row.
    - Do not implement quality_first, semantic routing, learned routing, or complexity routing.
    - Do not implement cheapest_compatible unless Scout and Judge receipts prove the conditional scope gate.
    - Do not store prompt or response bodies in simulation, budget checks, ledger metadata, or review artifacts.
    - Update docs, blockers, incomplete work, code review findings, review fixes, and verification receipts.
    - Do not stage, commit, push, or open a Phase 5 PR unless the user explicitly approves commit-prep or publish.
