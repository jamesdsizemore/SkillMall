# GoalBuddy v2 state.yaml — SkillMall Phase 2

version: 2

goal:
  title: "SkillMall Phase 2 — Community and Ecosystem"
  slug: skillmall-phase2
  kind: existing_plan
  tranche: "Build SkillMall Phase 2: SQLite backend + GitHub OAuth → ratings/reviews → collections, forking, multi-agent deploy, MCP server, trending, trigger evaluator, version history → documentation → completion audit. T101 (SQLite) first; T102 (OAuth) blocked until GitHub app credentials provisioned."
  status: done
  intake:
    original_request: "Build SkillMall Phase 2 from docs/superpowers/plans/PHASE-2-PLAN.md"
    interpreted_outcome: "A community-enabled SkillMall where users can rate skills, deploy collections, fork skills with lineage, publish to skills.sh, deploy to all agents at once, query the catalog via MCP, and see trending analytics — all on SQLite with GitHub OAuth"
    input_shape: existing_plan
    audience: "James Sizemore — project owner"
    authority: approved
    proof_type: demo
    completion_proof: "npm run build + npm test pass, db:migrate clean, GitHub OAuth round-trip works, review submission works, deploy-pack works, MCP search_skills works, trending renders, all 6 docs >= 500 words, James approves at T114"
    likely_misfire: "Building community features before T101+T102 are stable. Starting T102 before GitHub OAuth app is registered. Introducing Supabase or pgvector."
    blind_spots_considered:
      - "T102 is hard-blocked until GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are provisioned — T101 can start immediately, T102 cannot"
      - "better-sqlite3 is a native Node.js module — may require node-gyp on fresh installs; test on CI before assuming it works"
      - "Skills.sh OAuth endpoint must be verified publicly documented before T107 proceeds — may need to stub"
      - "SQLite WAL mode requires the database file to be on a local filesystem — Vercel's read-only filesystem means db writes fail in production; Phase 2 is local-first by design"
      - "Security check mandatory on every Phase 2 Worker task — all tasks touch auth, DB writes, or user data"
    existing_plan_facts:
      - "Full plan: docs/superpowers/plans/PHASE-2-PLAN.md — 64KB, all implementation embedded"
      - "Backend: SQLite via better-sqlite3 — no Supabase, no Prisma, no pgvector"
      - "DB file: data/skillmall.db (gitignored)"
      - "Migrations: db/migrations/ (SQL only, committed)"
      - "Runner: npm run db:migrate (node scripts/migrate.js)"
      - "Sessions table: id TEXT PK, github_id, github_login, scopes, created_at, expires_at"
      - "Install events table: zero PII — skill_slug + agent_type + installed_at only"
      - "Reviews: UNIQUE(skill_slug, reviewer_github_id) — one review per skill per user"
      - "GitHub OAuth: manual implementation (no next-auth) — state CSRF check required"
      - "Session cookie: sm_session, httpOnly, Secure in prod, SameSite=Strict, 7-day maxAge"
      - "Generic review detection: isGenericReview() checks against GENERIC_PHRASES list"
      - "Effectiveness score: quality-weighted average (specific reviews 2x weight)"
      - "MCP server: GET /api/mcp returns tool list, POST /api/mcp handles tools/list and tools/call"
      - "Multi-agent: 7 primary agents in registry (full 54 can be added incrementally)"
      - "Agent detection: filesystem check for ~/.claude/skills, ~/.cursor/skills, etc."
      - "Install event logged on every successful skill deploy"
      - "Development workflow: 16 steps per task — Steps 6 (tsc), 7 (lint), 8 (build), 9/11 (reviews) never skipped"
      - "Security check mandatory on EVERY Phase 2 Worker task"
      - "Parameterized queries only — no string concatenation in SQL"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: starting
    url: null
    command: "npx goalbuddy board /Users/jamesdsizemore/Developer/skill-mall/docs/goals/skillmall-phase2"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

