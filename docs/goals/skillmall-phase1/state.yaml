# GoalBuddy v2 state.yaml — SkillMall Phase 1

version: 2

goal:
  title: "SkillMall Phase 1 — Core System"
  slug: skillmall-phase1
  kind: existing_plan
  tranche: "Build SkillMall Phase 1: provider abstraction + Nothing design UI (T001–T006) → research pipeline + API routes (T007–T012) → CLI + quality tooling + docs (T013–T017) → completion audit (T018). UI approval gate (T006) blocks all pipeline work. Continuous execution until T018 passes."
  status: active
  intake:
    original_request: "Build SkillMall Phase 1 — comprehensive pipeline, UI, CLI, quality tooling, and docs"
    interpreted_outcome: "A working SkillMall Next.js application where users can configure a multi-provider LLM, create skills via the 6-step wizard or CLI, browse the catalog with quality scores, optimize prompts, and browse the prompt library — all Phase 1 features passing tests, building clean, UI approved by James"
    input_shape: existing_plan
    audience: "James Sizemore — project owner"
    authority: approved
    proof_type: demo
    completion_proof: "npm run build passes, npm test passes, npx tsc --noEmit clean, wizard completes all 6 steps with real LLM, CLI create + confirm-research produces a valid skill, James explicitly approves UI at T006, all T017 docs exist at >= 500 words each"
    likely_misfire: "Building pipeline before T006 UI approval. Implementing Phase 2 features. Making implementation decisions not in the Phase 1 plan. Treating spec descriptions as implementation guidance instead of reading the plan."
    blind_spots_considered:
      - "claude --print flag must be verified against installed claude CLI version before assuming it works"
      - "Provider configuration must be tested with 2+ different providers before Phase 1 ships"
      - "60 LLM calls for a 20-tool domain — loading UX must exist throughout wizard"
      - "UI approval gate (T006) is a hard block — no pipeline task activates until T006 passes"
    existing_plan_facts:
      - "Full plan at docs/superpowers/plans/PHASE-1-PLAN.md — 104KB, fully self-contained, all TypeScript types, LLM prompts, and algorithms embedded"
      - "Provider abstraction: OpenAI, Claude Code CLI (subprocess, NO Anthropic SDK), Gemini, Groq, Ollama — user supplies own keys"
      - "Claude Code uses execFile('claude', ['--print', '--model', model, prompt]) — verify --print flag against installed version"
      - "Nothing design: Space Grotesk / Space Mono / Doto, light default, dark toggle, --bg #F5F5F5, --accent #D71921, --blue #007AFF only, no green, no purple"
      - "Development workflow: 16 steps per task — Steps 6 (tsc), 7 (lint), 8 (build), 9 (first review), 11 (second review) are NEVER skipped"
      - "All types embedded in plan: ResearchResult, ResearchTool, InMemoryFile, WizardState, PromptAudit, QualityScore, PipelineInput"
      - "All Zod schemas embedded in plan: ResearchResultSchema, FrameworkSelectionSchema, PromptAuditSchema, PipelineInputSchema"
      - "All LLM prompt templates embedded in plan — use them word-for-word"
      - "Framework pre-filter data (FRAMEWORK_CANDIDATES, DOMAIN_MODIFIER_RULES) embedded in plan"
      - "Quality score rubric embedded in plan — exact point values for all 5 dimensions"
      - "Atomic write: temp dir + fs.rename — never write directly to output path"
      - "Stages 3 and 4 (Skill Builder + Prompt Engine) run in parallel with Promise.all"
      - "No Phase 2 features: no Supabase, no ratings, no collections, no MCP server, no skills.sh publishing"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: running
    url: "http://goalbuddy.localhost:41737/skillmall-phase1/"
    command: "npx goalbuddy board /Users/jamesdsizemore/Developer/skill-mall/docs/goals/skillmall-phase1"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: T007

